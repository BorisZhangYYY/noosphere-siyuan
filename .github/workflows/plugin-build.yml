name: Plugin Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: noosphere-siyuan-plugin
          path: package.zip

  # MVP 版本只发布 GitHub 安装包；构建通过后才能创建预览 Release。
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: noosphere-siyuan-plugin
      - name: Validate release version and prepare notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile

          tag = os.environ["GITHUB_REF_NAME"]
          version = json.loads(pathlib.Path("plugin.json").read_text())["version"]
          assert tag == f"v{version}", "Tag and plugin version must match"
          assert json.loads(pathlib.Path("package.json").read_text())["version"] == version
          archive = pathlib.Path("package.zip")
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None, "Installation ZIP is damaged"
              assert json.loads(package.read("plugin.json"))["version"] == version
              assert {"index.js", "index.css", "plugin.json", "README.md", ".docs/usage.md"} <= set(package.namelist())
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          section = re.search(r"^## \[" + re.escape(version) + r"\] - [^\n]+\n([\s\S]*?)(?=^## \[|\Z)", changelog, re.MULTILINE)
          assert section, "Release changelog is missing"
          assert "MVP 预览版" in section[1], "This workflow only publishes MVP previews"
          filename = f"noosphere-siyuan-{tag}.zip"
          archive.rename(filename)
          digest = hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()
          notes = section[1].strip() + "\n\n### 安装与验证\n\n"
          notes += f"下载 `{filename}`，解压到思源工作空间的 `data/plugins/noosphere-siyuan/`，然后重新启用插件或重启思源。\n\n"
          notes += "自动测试、类型检查、构建和安装包校验已通过。升级保留已有设置、草稿和文章历史。\n\n"
          notes += f"安装包 SHA-256：`{digest}`\n"
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes)
          PY
      - name: Publish MVP preview on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "noosphere-siyuan-${GITHUB_REF_NAME}.zip"
          --verify-tag --prerelease --latest=false
          --title "知流 ${GITHUB_REF_NAME} · MVP 预览版"
          --notes-file "$RUNNER_TEMP/release-notes.md"
