name: Plugin Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Validate syncable archive paths
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          with zipfile.ZipFile("package.zip") as package:
              assert not any(part.startswith(".") for name in package.namelist() for part in pathlib.PurePosixPath(name).parts), "Hidden archive entries are ignored by SiYuan sync"
              manifest = json.loads(package.read("plugin.json"))
              for path in manifest["readme"].values():
                  assert path in package.namelist(), f"Declared README is missing: {path}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: noosphere-siyuan-plugin
          path: package.zip

  # 构建和安装包校验通过后发布正式 package.zip，供集市检查和安装。
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: noosphere-siyuan-plugin
      - name: Validate release version and prepare notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile

          tag = os.environ["GITHUB_REF_NAME"]
          version = json.loads(pathlib.Path("plugin.json").read_text())["version"]
          assert tag == f"v{version}", "Tag and plugin version must match"
          assert json.loads(pathlib.Path("package.json").read_text())["version"] == version
          archive = pathlib.Path("package.zip")
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None, "Installation ZIP is damaged"
              assert json.loads(package.read("plugin.json"))["version"] == version
              assert {"index.js", "index.css", "plugin.json", "README.md", "CONTRIBUTING.md", "project/development.md", "docs/images/workbench.png"} <= set(package.namelist())
              manifest = json.loads(package.read("plugin.json"))
              assert "LICENSE" in package.namelist(), "Plugin license is missing"
              for path in manifest["readme"].values():
                  assert path in package.namelist(), f"Declared README is missing: {path}"
              for field in ("icon", "preview"):
                  if manifest.get(field):
                      assert manifest[field] in package.namelist(), f"Declared {field} is missing"
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          section = re.search(r"^## \[" + re.escape(version) + r"\] - [^\n]+\n([\s\S]*?)(?=^## \[|\Z)", changelog, re.MULTILINE)
          assert section, "Release changelog is missing"
          filename = "package.zip"
          digest = hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest()
          notes = section[1].strip() + "\n\n### 安装与验证\n\n"
          notes += f"下载 `{filename}`，解压到思源工作空间的 `data/plugins/noosphere-siyuan/`，然后重新启用插件或重启思源。\n\n"
          notes += "自动测试、类型检查、构建和安装包校验已通过。升级保留已有设置、草稿和文章历史。\n\n"
          notes += f"安装包 SHA-256：`{digest}`\n"
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes)
          PY
      - name: Publish package on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "package.zip"
          --verify-tag
          --latest
          --title "知流 ${GITHUB_REF_NAME}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
